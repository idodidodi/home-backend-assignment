services:
  postgres:
    image: postgres:15-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streets
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  adminer:
    image: adminer
    restart: always
    ports:
      - 8089:8080  
    networks:
      - app-network

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.16
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - '1G'
      - --mode
      - dev-container
      - --overprovisioned
      - --kafka-addr
      - INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - 9092:9092
      - 29092:29092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.3.8
    container_name: redpanda-console
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=redpanda:29092
      - CONNECT_ENABLED=false
      - SCHEMA_REGISTRY_ENABLED=false
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  publisher:
    build: .
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - KAFKA_BROKER=redpanda:29092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=streets
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - app-network

volumes:
  postgres_data:
  redpanda_data:

networks:
  app-network:
    name: app-network
    driver: bridge
